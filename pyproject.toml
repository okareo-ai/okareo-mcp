[project]
name = "okareo-mcp"
version = "0.0.57"
description = "Okareo MCP server for AI model evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.13"
authors = [
    { name = "Okareo", email = "support@okareo.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # 2.x renamed FastMCP and changed the internals the server relies on.
    "mcp[cli]>=1.27,<2",
    "okareo>=0.0.159,<0.0.160",
    # Worker threads for tools (src/tool_threads.py); installed today only
    # through mcp. 4.5 is the oldest mcp accepts.
    "anyio>=4.5,<5",
    # attrs.evolve copies the API client without a timeout (src/run_start.py);
    # installed today only through okareo. 22.2 added field-alias support.
    "attrs>=22.2,<26",
    "httpx",
    "PyJWT[crypto]>=2.9",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "langcodes[data]>=3.3",
]

[project.urls]
Homepage = "https://github.com/okareo-ai/okareo-mcp-dev"
Documentation = "https://docs.okareo.com/docs/mcp/introduction"
Repository = "https://github.com/okareo-ai/okareo-mcp-dev"
Issues = "https://github.com/okareo-ai/okareo-mcp-dev/issues"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["templates/*.md"]

[project.scripts]
okareo-mcp = "src.server:main"
okareo-mcp-setup = "src.setup_cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout>=2.3,<3",
    "ruff",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout>=2.3,<3",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that hangs fails instead of stalling CI and the deploy behind it.
timeout = 120
filterwarnings = [
    # Third-party: the okareo SDK subclasses mcp's ClientSession. We can't fix
    # the source; scope the ignore to that one class so our own deprecations
    # still surface.
    "ignore:Inheritance class PatchedClientSession from ClientSession is discouraged:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
